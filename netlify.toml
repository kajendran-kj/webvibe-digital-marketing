[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/public-content"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/public-lead"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
